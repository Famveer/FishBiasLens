<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/styles.css') }}">
    <script src=" https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" charset="utf-8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" charset="utf-8"></script>
</head>
<body class="page-graph">
<div id="graph">
</div>
<div id="config">
    <div class="control">
        Select algorithm:
        <select name="algorithm_select" id="algorithm_select">
            <option value="Both">Both</option>
            <option value="ShadGPT">ShadGPT</option>
            <option value="BassLine">BassLine</option>
            <option value="OwnExtraction">OwnExtraction</option>
        </select> 
    </div>
    <div class="control">
        <button id="update_filters">Filter</button>
    </div>
    <div id='tooltip'>
        <div id='tooltip_title'></div>
        <div id='tooltip_body'></div>
    </div>
</div>
<div id="timeline_container">
</div>
<script type="text/javascript">
var data = {{data|tojson}};
const transactions = {{transactions|tojson}};
const positions = {{positions|tojson}};
const timesteps = {{timesteps|tojson}};
const journals = {{journals|tojson}};
const data_felipe = {{data_felipe|tojson}};
</script>
<script type="text/javascript" src="{{ url_for('static',filename='js/graph.js') }}"></script>
</body>
</html>
